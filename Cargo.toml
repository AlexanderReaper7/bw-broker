[package]
name = "bw-app-gate"
version = "0.1.0"
edition = "2021"

[dependencies]
rbw = { version = "1.15", default-features = false }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
pinentry = "0.8"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"
anyhow = "1.0"
libc = "0.2"
totp-rs = { version = "6.0", features = ["otpauth"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
