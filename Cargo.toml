[package]
name = "bw-broker"
version = "0.1.0"
edition = "2021"

[dependencies]
rbw = { version = "1.15", default-features = false }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
pinentry = "0.8"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1.9"
anyhow = "1.0"
libc = "0.2"
totp-rs = { version = "6.0", features = ["otpauth"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1.0.9"
mail-parser = "0.11.9"
futures-util = "0.3.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
